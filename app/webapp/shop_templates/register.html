{% extends "base.html" %}
{% block title %}{{ t("register_title") }} — {{ t("brand") }}{% endblock %}
{% block body %}
<section class="section">
  <div class="container narrow">
    <h2 class="section-title">{{ t("register_title") }}</h2>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" action="/shop/register">
      <input type="hidden" name="next" value="{{ next }}">
      <input type="hidden" name="ref" value="{{ ref }}">
      <div class="field">
        <label for="email">{{ t("email_label") }}</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="field">
        <label for="password">{{ t("password_label") }}</label>
        <input type="password" id="password" name="password" required minlength="8">
      </div>
      <div class="field">
        <label for="password_confirm">{{ t("password_confirm_label") }}</label>
        <input type="password" id="password_confirm" name="password_confirm" required minlength="8">
      </div>
      <div class="field" style="display:flex; align-items:flex-start; gap:8px;">
        <input type="checkbox" id="agree" name="agree" required style="width:auto; margin-top:3px;">
        <label for="agree" style="margin:0; font-size:13px;">{{ t("agree_to_terms") | safe }}</label>
      </div>
      <button class="btn block" type="submit">{{ t("register_submit") }}</button>
    </form>
    <p class="divider">{{ t("have_account") }} <a href="/shop/login?next={{ next }}">{{ t("login_title") }}</a></p>
  </div>
</section>
{% endblock %}
