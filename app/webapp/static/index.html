<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>eSIM Store</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/style.css?v=10">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button id="back-btn" class="icon-btn" hidden aria-label="Back">←</button>
      <img class="brand-logo brand-logo-light" src="/img/logo-light.jpg" alt="KaLine">
      <img class="brand-logo brand-logo-dark" src="/img/logo-dark.jpg" alt="KaLine">
      <h1 id="header-title">KaLine</h1>
      <div class="lang-switch">
        <button class="lang-btn" data-lang="ru">RU</button>
        <button class="lang-btn" data-lang="hy">ՀՀ</button>
        <button class="lang-btn" data-lang="en">EN</button>
      </div>
      <button id="notif-bell-btn" class="icon-btn" aria-label="Notifications">🔔<span id="notif-badge" class="notif-badge" hidden></span></button>
      <button id="theme-toggle" class="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Тема оформления">
        <span class="knob"></span>
      </button>
    </header>

    <!-- Главный экран: быстрые действия + категории + регионы + почему мы -->
    <main id="screen-home" class="screen">
      <div class="quick-actions">
        <button class="quick-action-btn" id="quick-buy-esim">
          <span class="quick-action-icon qa-purple">🛍️</span>
          <span data-i18n="quick_buy_esim"></span>
        </button>
        <button class="quick-action-btn" id="quick-my-esims">
          <span class="quick-action-icon qa-blue">📶</span>
          <span data-i18n="quick_my_esims"></span>
        </button>
        <button class="quick-action-btn" id="quick-favorites">
          <span class="quick-action-icon qa-orange">♡</span>
          <span data-i18n="quick_favorites"></span>
        </button>
        <button class="quick-action-btn" id="quick-topup">
          <span class="quick-action-icon qa-green">💳</span>
          <span data-i18n="quick_topup"></span>
        </button>
      </div>

      <div class="category-card" id="category-esim">
        <div class="category-emoji">🌍</div>
        <div class="category-text">
          <div class="category-title" data-i18n="home_esim_title"></div>
          <div class="category-subtitle" data-i18n="home_esim_subtitle"></div>
        </div>
      </div>
      <div id="dynamic-categories"></div>

      <h3 class="section-heading" data-i18n="home_regions_title"></h3>
      <div id="region-list" class="list"></div>

      <div class="why-us-card">
        <h3 class="section-heading" data-i18n="home_why_title"></h3>
        <div class="why-row"><span class="why-icon">⚡</span><span data-i18n="why_instant"></span></div>
        <div class="why-row"><span class="why-icon">🛡️</span><span data-i18n="why_secure"></span></div>
        <div class="why-row"><span class="why-icon">✈️</span><span data-i18n="why_no_roaming"></span></div>
        <div class="why-row"><span class="why-icon">💬</span><span data-i18n="why_support"></span></div>
      </div>
    </main>

    <!-- eSIM: страны -->
    <main id="screen-esim-countries" class="screen" hidden>
      <input id="search-input" class="search" type="text" data-i18n-placeholder="search_country_placeholder">
      <div class="promo-strip" style="margin-bottom:10px;">
        <button id="filter-all-btn" class="promo-pill active" type="button" data-i18n="filter_all"></button>
        <button id="filter-favorites-btn" class="promo-pill" type="button" data-i18n="filter_favorites"></button>
      </div>
      <div id="country-list" class="list"></div>
    </main>

    <!-- eSIM: пакеты -->
    <main id="screen-esim-packages" class="screen" hidden>
      <div id="package-list" class="list"></div>
    </main>

    <!-- eSIM: чекаут -->
    <main id="screen-esim-checkout" class="screen" hidden>
      <div id="checkout-summary" class="card"></div>
      <div id="payment-methods">
        <button id="pay-balance-btn" class="primary-btn" data-i18n="checkout_pay_balance" hidden></button>
        <button id="pay-idram-btn" class="primary-btn" style="margin-top:8px;" data-i18n="pay_idram"></button>
        <button id="pay-walletpay-btn" class="primary-btn" style="margin-top:8px;" data-i18n="pay_wallet"></button>
        <button id="pay-oxapay-btn" class="primary-btn" style="margin-top:8px;" data-i18n="pay_oxapay"></button>
        <button id="pay-test-btn" class="primary-btn test-btn" style="margin-top:8px;" hidden>🧪 Тестовая оплата</button>
      </div>
      <div id="payment-waiting" hidden>
        <p class="hint" data-i18n="payment_waiting"></p>
      </div>
      <p class="hint" data-i18n="qr_hint"></p>
    </main>

    <!-- Лаунж / Туры: список товаров -->
    <main id="screen-products" class="screen" hidden>
      <div id="products-list" class="list"></div>
    </main>

    <!-- Профиль -->
    <main id="screen-profile" class="screen" hidden>
      <div class="profile-header">
        <div class="profile-avatar" id="profile-avatar">?</div>
        <div class="profile-name" id="profile-name"></div>
      </div>

      <div class="list">
        <button class="row profile-row" id="profile-balance-row">
          <span class="flag">💳</span>
          <div class="main"><div class="title" data-i18n="nav_balance"></div></div>
          <span class="meta" id="profile-balance-value">$0.00</span>
          <span class="chevron">›</span>
        </button>
        <button class="row profile-row" id="profile-referral-row">
          <span class="flag">🎁</span>
          <div class="main"><div class="title" data-i18n="referral_title"></div></div>
          <span class="chevron">›</span>
        </button>
        <button class="row profile-row" id="profile-favorites-row">
          <span class="flag">♡</span>
          <div class="main"><div class="title" data-i18n="quick_favorites"></div></div>
          <span class="chevron">›</span>
        </button>
        <button class="row profile-row" id="profile-help-row">
          <span class="flag">🆘</span>
          <div class="main"><div class="title" data-i18n="profile_help"></div></div>
          <span class="chevron">›</span>
        </button>
        <div class="row profile-row">
          <span class="flag">🌐</span>
          <div class="main"><div class="title" data-i18n="profile_language"></div></div>
          <span class="meta" id="profile-lang-value"></span>
        </div>
      </div>

      <div class="referral-promo-card">
        <div class="hint" data-i18n="referral_title"></div>
        <p id="profile-referral-desc" class="hint"></p>
        <input id="profile-referral-link" class="search" type="text" readonly onclick="this.select()">
      </div>

      <div class="referral-promo-card">
        <div class="hint" data-i18n="promo_title"></div>
        <input id="promo-code-input" class="search" type="text" data-i18n-placeholder="promo_placeholder" style="margin: 10px 0;">
        <button id="promo-redeem-btn" class="btn" data-i18n="promo_redeem_btn"></button>
      </div>
    </main>

    <!-- Уведомления -->
    <main id="screen-notifications" class="screen" hidden>
      <div class="promo-strip" style="margin-bottom:12px;">
        <button class="promo-pill notif-filter-btn active" data-type="all" type="button" data-i18n="notif_filter_all"></button>
        <button class="promo-pill notif-filter-btn" data-type="order" type="button" data-i18n="notif_filter_order"></button>
        <button class="promo-pill notif-filter-btn" data-type="payment" type="button" data-i18n="notif_filter_payment"></button>
        <button class="promo-pill notif-filter-btn" data-type="system" type="button" data-i18n="notif_filter_system"></button>
      </div>
      <div id="notifications-list" class="list"></div>
    </main>

    <!-- Мои eSIM -->
    <main id="screen-my-esims" class="screen" hidden>
      <div id="my-esims-list" class="list"></div>
    </main>

    <!-- Баланс / пополнение / рефералка -->
    <main id="screen-balance" class="screen" hidden>
      <div class="card" style="text-align:center;">
        <div class="hint" data-i18n="balance_current"></div>
        <div id="balance-amount" class="esims-count">$0.00</div>
      </div>

      <div class="card">
        <h3 style="margin:0 0 10px;" data-i18n="balance_topup_title"></h3>
        <input id="topup-amount-input" class="search" type="number" min="1" placeholder="10" style="margin-bottom:10px;">
        <button id="topup-idram-btn" class="primary-btn" data-i18n="pay_idram"></button>
        <button id="topup-oxapay-btn" class="primary-btn" style="margin-top:8px;" data-i18n="pay_oxapay"></button>
      </div>

      <div class="card">
        <h3 style="margin:0 0 8px;" data-i18n="referral_title"></h3>
        <p id="referral-desc" class="hint"></p>
        <input id="referral-link-input" class="search" type="text" readonly onclick="this.select()">
      </div>

      <div id="topup-history" class="list"></div>
    </main>

    <!-- Чаты: список -->
    <main id="screen-chats" class="screen" hidden>
      <button id="new-support-chat-btn" class="primary-btn" data-i18n="chats_new_support"></button>
      <div id="chats-list" class="list" style="margin-top:12px;"></div>
    </main>

    <!-- Чат: переписка -->
    <main id="screen-chat" class="screen chat-screen" hidden>
      <div id="chat-messages" class="messages"></div>
      <div class="composer">
        <button id="chat-attach-btn" class="attach-btn" type="button" aria-label="Attach">📎</button>
        <input id="chat-file-input" type="file" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.txt" hidden>
        <input id="chat-input" type="text" data-i18n-placeholder="chat_input_placeholder">
        <button id="chat-send-btn" class="send-btn">➤</button>
      </div>
    </main>

    <nav class="tabbar">
      <button class="tab-btn active" data-tab="home">
        <span class="tab-icon">🏠</span><span data-i18n="tab_home"></span>
      </button>
      <button class="tab-btn" data-tab="browse">
        <span class="tab-icon">🔍</span><span data-i18n="tab_browse"></span>
      </button>
      <button class="tab-btn" data-tab="my-esims">
        <span class="tab-icon">📶</span><span data-i18n="tab_my_esims"></span>
      </button>
      <button class="tab-btn" data-tab="profile">
        <span class="tab-icon">👤</span><span data-i18n="tab_profile"></span>
      </button>
    </nav>
    <button id="floating-chat-btn" class="floating-chat-btn" aria-label="Support chat">💬</button>
  </div>

  <!-- ?v=2 — версия статики. Telegram иногда держит JS/CSS в дисковом кэше даже после
       полного перезапуска приложения; при каждом обновлении app.js/i18n.js/style.css
       увеличивай это число — иначе клиент может продолжать использовать старую версию. -->
  <script src="/i18n.js?v=6"></script>
  <script src="/app.js?v=6"></script>
</body>
</html>
