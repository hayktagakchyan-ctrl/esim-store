# Обратный прокси перед сервисами webapp и admin на Railway. Даёт то, чего нет
# "из коробки" у самого Railway: rate limiting на чувствительных путях (логин,
# регистрация, чекаут) и единый формат access/error-логов для всего трафика.
#
# ВАЖНО перед деплоем — два места ниже нужно поправить под себя:
#   1. server_name — впиши свои реальные поддомены (shop.твой-домен.am и т.п.)
#   2. proxy_pass — адреса private-networking Railway (SERVICE.railway.internal:PORT).
#      PORT здесь должен быть ЗАФИКСИРОВАН как обычная переменная окружения
#      PORT в настройках сервисов webapp/admin в Railway (см. RAILWAY_DEPLOY.md,
#      раздел про Nginx) — если оставить порт "плавающим" (как назначает Railway
#      по умолчанию), приватная сеть не будет знать, куда стучаться.

log_format detailed
    '$remote_addr - $time_iso8601 "$request" '
    'status=$status bytes=$body_bytes_sent '
    'referer="$http_referer" ua="$http_user_agent" '
    'rt=$request_time';

access_log /dev/stdout detailed;
error_log /dev/stderr warn;

# --- Зоны для rate limiting: разные лимиты для разных по чувствительности путей ---
# Логин/регистрация/восстановление пароля — самые частые цели перебора паролей.
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;
# Чекаут — защита от накрутки фейковых заказов скриптом.
limit_req_zone $binary_remote_addr zone=checkout_zone:10m rate=30r/m;
# Всё остальное — мягкий общий лимит просто на всякий случай.
limit_req_zone $binary_remote_addr zone=general_zone:10m rate=120r/m;

# =====================  Сайт + Mini App + вебхуки (webapp)  =====================
server {
    listen 80;
    server_name shop.твой-домен.am;  # <-- поправь на свой реальный поддомен

    limit_req zone=general_zone burst=20 nodelay;

    location ~ ^/shop/(login|register|forgot-password) {
        limit_req zone=auth_zone burst=5 nodelay;
        proxy_pass http://webapp.railway.internal:8001;
        include /etc/nginx/proxy_params.conf;
    }

    location ~ ^/shop/checkout {
        limit_req zone=checkout_zone burst=10 nodelay;
        proxy_pass http://webapp.railway.internal:8001;
        include /etc/nginx/proxy_params.conf;
    }

    # Вебхуки (esimaccess/Idram/OxaPay) — намеренно БЕЗ rate limit: это внешние
    # системы, которые сами решают, как часто слать, лимитировать их нельзя.
    location ~ ^/webhooks/ {
        proxy_pass http://webapp.railway.internal:8001;
        include /etc/nginx/proxy_params.conf;
    }

    location / {
        proxy_pass http://webapp.railway.internal:8001;
        include /etc/nginx/proxy_params.conf;
    }
}

# =====================  Админ-панель (admin)  =====================
server {
    listen 80;
    server_name admin.твой-домен.am;  # <-- поправь на свой реальный поддомен

    location = /login {
        limit_req zone=auth_zone burst=5 nodelay;
        proxy_pass http://admin.railway.internal:8000;
        include /etc/nginx/proxy_params.conf;
    }

    location / {
        limit_req zone=general_zone burst=20 nodelay;
        proxy_pass http://admin.railway.internal:8000;
        include /etc/nginx/proxy_params.conf;
    }
}
