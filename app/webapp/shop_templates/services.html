{% extends "base.html" %}
{% block title %}{{ t("services_title") }} — {{ t("brand") }}{% endblock %}
{% block body %}
<section class="section">
  <div class="container narrow">
    <h2 class="section-title">{{ t("services_title") }}</h2>
    {% for c in categories %}
    <a class="row" href="/shop/services/{{ c.slug }}">
      <span class="name">{{ c.icon }} {{ c.title }}</span>
      <span class="meta">›</span>
    </a>
    {% else %}
    <p class="hint" style="text-align:center;">{{ t("services_empty") }}</p>
    {% endfor %}
  </div>
</section>
{% endblock %}
