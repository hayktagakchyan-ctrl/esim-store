{% extends "base.html" %}
{% block title %}{{ t("error_title") }} — {{ t("brand") }}{% endblock %}
{% block body %}
<section class="section">
  <div class="container narrow" style="text-align:center;">
    <p class="eyebrow-badge" style="margin-bottom:16px;">{{ status_code }}</p>
    <h2 class="section-title center">{{ t("error_title") }}</h2>
    <p class="hint" style="margin-bottom:24px;">{{ t(message_key) }}</p>
    <a class="btn" href="/shop/">{{ t("error_home_button") }}</a>
  </div>
</section>
{% endblock %}
